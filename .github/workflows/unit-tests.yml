name: Unit Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build gperf device-tree-compiler \
            gcc g++ make python3-dev python3-pip \
            python3-setuptools python3-wheel \
            xz-utils file

      - name: Install west
        run: pip install west

      - name: Initialize Zephyr workspace
        run: |
          west init -m https://github.com/zephyrproject-rtos/zephyr \
            --mr v4.5.0-rc3 zephyrproject
          cd zephyrproject
          west update
          west zephyr-export
          pip install -r zephyr/scripts/requirements.txt

      - name: Build unit tests
        working-directory: zephyrproject
        env:
          ZEPHYR_TOOLCHAIN_VARIANT: host
        run: |
          west build -p always \
            -b native_sim \
            "$GITHUB_WORKSPACE/tests/unit" \
            -d "$GITHUB_WORKSPACE/build-unit"

      - name: Run unit tests
        working-directory: zephyrproject
        run: west build -t run -d "$GITHUB_WORKSPACE/build-unit"

